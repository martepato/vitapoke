math-neon         https://github.com/Rinnegatamante/math-neon.git      0faab814782c071ff4015527f1ca955ab1ccc470  MIT
vitaShaRK         https://github.com/Rinnegatamante/vitaShaRK.git      df24065e65098b2d1ac533760109ad4367573f28  LGPL-3.0 (header only)
