# Vita port (build-vita.sh). vitaGL is the OpenGL-over-GXM layer the sceGu shim in port/vita/gu targets;
# math-neon is its ARM NEON math dependency. vitaShaRK is fetched for its header only: vitaGL.h includes
# it, but the runtime shader compiler it wraps is stubbed out in port/vita/shark_stub.c so a console does
# not need libshacccg.suprx.
